name: Bug report
description: Something on Destava did not work.
title: "Bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        What you write here is the bug report.
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: What you did, and what Destava did instead.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The page, or the chat. About when helps too.
      placeholder: https://destava.com
    validations:
      required: false
